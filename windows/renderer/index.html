<!DOCTYPE html>

<head>

        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>AI 额度</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="character"><img id="avatar" alt="" /></div>

      <span class="dot purple"></span>

    </div>
  </div>
  <script src="renderer.js"></script>
