name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      # GitHub Releases 在该 runner 上频繁 504，改用镜像下载 Electron 与打包工具
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show environment
        run: |
          node --version
          npm --version
          Get-ComputerInfo -Property OsName,OsVersion | Format-List

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/providers/index.js
          node --check renderer/renderer.js
          Write-Host "syntax OK"

      - name: Smoke test sql.js
        run: |
          node -e "const init=require('sql.js'); init({locateFile:f=>require.resolve('sql.js/dist/'+f)}).then(SQL=>{const db=new SQL.Database(); db.run('create table t(a)'); db.run('insert into t values (1)'); const r=db.exec('select a from t'); if(r[0].values[0][0]!==1) throw new Error('unexpected'); console.log('sql.js OK')})"

      - name: Verify wasm is unpacked
        run: |
          if (-not (Test-Path "node_modules/sql.js/dist/sql-wasm.wasm")) { throw "missing sql-wasm.wasm" }
          Write-Host "wasm present"
        shell: pwsh

      - name: Build installer
        run: npm run build

      - name: List output
        run: Get-ChildItem dist | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIQuotaHUD-windows
          path: |
            windows/dist/*.zip
          retention-days: 14
          if-no-files-found: warn
